
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تسجيل الحضور</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f3f5f8;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 15px;
    }
    button {
      background: #176b45;
      color: white;
      border: 0;
      padding: 13px 25px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }
    #reader {
      margin-top: 20px;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>نظام تسجيل الحضور</h2>
    <p>اختبار تشغيل ماسح QR</p>
    <button onclick="startScanner()">فتح الكاميرا</button>
    <div id="reader"></div>
    <p id="status">الماسح جاهز</p>
  </div>

  <script>
    let scanner;

    function startScanner() {
      document.getElementById("status").textContent =
        "جاري تشغيل الكاميرا...";

      scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decodedText) => {
          document.getElementById("status").textContent =
            "تم قراءة QR بنجاح: " + decodedText;

          await scanner.stop();
        }
      ).catch(error => {
        document.getElementById("status").textContent =
          "تعذر تشغيل الكاميرا: " + error;
      });
    }
  </script>
</body>
</html>
