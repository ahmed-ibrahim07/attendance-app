
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختبار اتصال نظام الحضور</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      padding: 20px;
      color: #222;
    }
    .container {
      max-width: 480px;
      margin: 30px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
    }
    h2 { color: #173b65; }
    button {
      width: 100%;
      padding: 14px;
      background: #173b65;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    #status {
      margin-top: 18px;
      padding: 12px;
      background: #eee;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    iframe { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>اختبار اتصال نظام الحضور</h2>
  <p>اضغط الزر لاختبار الاتصال بين الموقع والخادم.</p>
  <button onclick="testConnection()">اختبار الاتصال</button>
  <div id="status">في انتظار الاختبار...</div>
</div>

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycbwuqFij3OHu-uVFYghAS4CKVz0CFQLbjCLCziJLXP9QFWd84weWAZUAyba9yzzh9xCN/exec?page=bridge"
  title="الاتصال بالخادم">
</iframe>

<script>
  const bridgeFrame = document.getElementById("bridgeFrame");
  const allowedOrigin = "https://ahmed-ibrahim07.github.io";

  let bridgeLoaded = false;
  let requestId = "";

  function showStatus(message) {
    document.getElementById("status").textContent = message;
  }

  bridgeFrame.addEventListener("load", function() {
    bridgeLoaded = true;
    showStatus("تم تحميل إطار الاتصال. اضغط اختبار الاتصال.");
  });

  function testConnection() {
    if (!bridgeLoaded || !bridgeFrame.contentWindow) {
      showStatus("إطار الاتصال لم يكتمل تحميله.");
      return;
    }

    requestId = "TEST_" + Date.now();

    showStatus("تم إرسال طلب الاختبار. في انتظار رد الخادم...");

    bridgeFrame.contentWindow.postMessage({
      type: "TEST_REQUEST",
      requestId: requestId
    }, "*");

    setTimeout(function() {
      if (requestId) {
        showStatus(
          "لم يصل رد خلال 10 ثوانٍ. راجع نتيجة الاختبار وسجل التنفيذ."
        );
      }
    }, 10000);
  }

  window.addEventListener("message", function(event) {
    if (event.source !== bridgeFrame.contentWindow) return;

    const data = event.data;
    if (!data || typeof data !== "object") return;

    if (data.type === "BRIDGE_DEBUG") {
      showStatus("رسالة تشخيص من الخادم: " + data.message);
      return;
    }

    if (data.requestId === requestId) {
      showStatus("وصل رد من الخادم بنجاح.");
      requestId = "";
    }
  });
</script>

</body>
</html>
